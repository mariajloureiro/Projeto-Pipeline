name: Pipeline DevOps

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # 1 - BUILD
  build:
    name: 1 - Build
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar projeto
        run: npm run build --if-present


  # 2 - LINT
  lint:
    name: 2 - Lint
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar ESLint
        run: npm run lint


  # 3 - TESTES
  test:
    name: 3 - Testes
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar relatório de testes
        if: always()
        run: npm test -- --coverage

      - name: Salvar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: coverage/


  # 4 - SECURITY
  security:
    name: 4 - Security
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditoria de segurança
        run: npm audit --audit-level=high


  # 5 - DEPLOY DEV
  deploy-dev:
    name: 5 - Deploy Dev
    needs: security
    runs-on: ubuntu-latest

    environment:
      name: development

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Simular Deploy Dev
        run: |
          echo "Iniciando deploy no ambiente DEV"
          echo "Código enviado para desenvolvimento."
          echo "Deploy Dev concluído com sucesso."


  # 6 - SMOKE TEST
  smoke-test:
    name: 6 - Smoke Test
    needs: deploy-dev
    runs-on: ubuntu-latest

    steps:
      - name: Executar Smoke Test
        run: |
          echo "Executando Smoke Test..."
          echo "Aplicação está respondendo corretamente."
          echo "Smoke Test aprovado com sucesso."


  # 7 - HOMOLOGAÇÃO
  homologacao:
    name: 7 - Homologação
    needs: smoke-test
    runs-on: ubuntu-latest

    environment:
      name: homologacao

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Homologar aplicação
        run: |
          echo "Iniciando homologação..."
          echo "Aplicação validada."
          echo "Homologação concluída com sucesso."


  # 8 - PRODUÇÃO
  producao:
    name: 8 - Produção
    needs: homologacao
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Deploy Produção
        run: |
          echo "Iniciando deploy em PRODUÇÃO"
          echo "Aplicação publicada em produção."
          echo "Deploy de produção concluído com sucesso."