name: 🚀 Enterprise DevOps Pipeline

on:
  push:
    branches: [ "main", "develop" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main", "develop" ]
    types: [ opened, synchronize, reopened ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  security-events: write

jobs:
  # ==========================================
  # 1. SETUP & CACHE COMPARTILHADO
  # ==========================================
  setup:
    name: 🏗️ Setup & Dependencies
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-npm.outputs.cache-hit }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Node Modules
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install Dependencies
        run: npm ci --prefer-offline

  # ==========================================
  # 2. QUALIDADE, TESTES E SEGURANÇA (PARALELO)
  # ==========================================
  lint:
    name: 🧹 Code Quality (ESLint)
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run ESLint
        run: npm run lint

  security-audit:
    name: 🛡️ Security Audit & Vulnerabilities
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Check Dependencies Security
        run: npm audit --audit-level=high

  matrix-test:
    name: 🧪 Unit Tests (${{ matrix.os }} - Node ${{ matrix.node }})
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - name: Run Jest Tests with Coverage
        run: npm test -- --coverage --ci
      - name: Upload Coverage Artifact
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/

  # ==========================================
  # 3. COMPILAÇÃO E ARTEFATOS (BUILD)
  # ==========================================
  build:
    name: 📦 Build Application & Artifacts
    needs: [lint, security-audit, matrix-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build Web Assets
        run: |
          # Adicione aqui seu comando de build se possuir (ex: npm run build)
          mkdir -p dist
          cp -r *.html *.css *.js dist/ 2>/dev/null || true
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          retention-days: 7

  # ==========================================
  # 4. DEPLOY MULTI-ENVIRONMENT
  # ==========================================
  deploy-dev:
    name: 🚀 Deploy -> Development
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: production-build
      - name: Deploy to Dev Server
        run: echo "Deploy efetuado no ambiente de Desenvolvimento!"

  deploy-staging:
    name: 🔷 Deploy -> Staging (Homologação)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: production-build
      - name: Deploy to Staging
        run: echo "Deploy efetuado no ambiente de Homologação!"

  smoke-tests:
    name: 🔍 Post-Deploy Smoke Tests
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: Run E2E Health Checks
        run: echo "Todos os serviços de Staging estão operacionais!"

  deploy-prod:
    name: 🌟 Deploy -> Production
    needs: smoke-tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: production-build
      - name: Deploy to Production
        run: echo "Deploy em Produção realizado com sucesso!"

  # ==========================================
  # 5. SUMÁRIO DA EXECUÇÃO (JOB SUMMARY)
  # ==========================================
  workflow-summary:
    name: 📊 Pipeline Summary
    needs: [deploy-prod]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Summary Report
        run: |
          echo "## 📈 Relatório do Execution Flow" >> $GITHUB_STEP_SUMMARY
          echo "* **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "* **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "* **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "### Status das Etapas:" >> $GITHUB_STEP_SUMMARY
          echo "- Build & Tests: Completo ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Pipeline Status: Concluído com Sucesso 🎉" >> $GITHUB_STEP_SUMMARY